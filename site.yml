---
- hosts: databases
  become: true
  tasks:

  - name: update repository index   
    tags: mysql,mariadb,ubuntu 
    apt:
      update_cache: yes

  - name: install apache2 package
    apt:
      name: apache2
      state: latest
    when: ansible_distribution =="Ubuntu"

- hosts: workstations
  become: true
  tasks:

  - name: install unzip
    package:
      name: unzip
    
  - name: install terraform
    unarchive:
      src: https://releases.hashicorp.com/terraform/1.16.2/terraform_1.16.2_linux_amd64.zip
      dest: /usr/local/bin
      remote_src: yes
      mode: 0755
      owner: root
      group: root



- hosts: webservers
  become: true
  tasks:

  - name: add php support
    tags: apache2,http,https,ubuntu
    apt:
      name: libapache2-mod-php
      state: latest

  - name: copy site file
    tags: apache2,http,ubuntu
    copy:
      src: default_site.html
      dest: /var/www/html/index.html
      owner: root
      group: root
      mode: 0644

